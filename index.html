
<!DOCTYPE html>
<html lang="fr" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MZ+ Elite System</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;0,700;1,300;1,400;1,500;1,600;1,700&display=swap" rel="stylesheet">
    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            fontFamily: { sans: ['Inter', 'sans-serif'] },
            animation: {
              'bell-ring': 'ring 3s ease-in-out infinite',
              'fade-in': 'fade-in 0.4s ease-out forwards',
              'slide-down': 'slide-down 0.5s cubic-bezier(0.16, 1, 0.3, 1) forwards',
            },
            keyframes: {
              ring: {
                '0%, 100%': { transform: 'rotate(0)' },
                '5%, 15%, 25%': { transform: 'rotate(15deg)' },
                '10%, 20%, 30%': { transform: 'rotate(-15deg)' },
              },
              'fade-in': {
                'from': { opacity: '0', transform: 'translateY(10px)' },
                'to': { opacity: '1', transform: 'translateY(0)' },
              },
              'slide-down': {
                'from': { opacity: '0', transform: 'translateY(-20px)' },
                'to': { opacity: '1', transform: 'translateY(0)' },
              }
            }
          }
        }
      }
    </script>
    <style>
      body { 
        margin: 0; 
        overflow-x: hidden; 
        background-color: #050505; 
        color: #f5f5f5;
      }
      
      ::-webkit-scrollbar { width: 6px; }
      ::-webkit-scrollbar-track { background: #050505; }
      ::-webkit-scrollbar-thumb { background: #222; border-radius: 10px; }
    </style>
  <link rel="stylesheet" href="/index.css">
</head>
  <body class="bg-[#050505] text-neutral-100">
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
